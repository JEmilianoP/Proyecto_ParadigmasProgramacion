<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxy Games - Tienda</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white">
    <nav class="navbar navbar-expand-lg navbar-dark bg-secondary px-4">
        <a class="navbar-brand text-primary fw-bold" href="#">Galaxy Games</a>
        <div class="ms-auto d-flex align-items-center">
            <span class="navbar-text text-white me-3" id="welcomeUser"></span>
            <button class="btn btn-danger btn-sm" id="logoutBtn">Cerrar Sesión</button>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row">
            <div class="col-lg-8">
                <h2 class="mb-4 text-info">Catálogo de Videojuegos</h2>
                <div class="row row-cols-1 row-cols-md-2 g-4" id="productsCatalog">
                    </div>
            </div>

            <div class="col-lg-4">
                <div class="card bg-secondary text-white position-sticky" style="top: 20px;">
                    <div class="card-body">
                        <h3 class="card-title text-warning border-bottom pb-2">Tu Carrito</h3>
                        <div id="cartItems" class="my-3" style="max-height: 300px; overflow-y: auto;">
                            </div>
                        <div class="d-flex justify-content-between align-items-center fw-bold fs-5 pt-2 border-top">
                            <span>Total:</span>
                            <span id="cartTotal">$0.00</span>
                        </div>
                        <button class="btn btn-success w-100 mt-3" id="checkoutBtn" disabled>Proceder al Pago</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="javascripts/cliente.js"></script>
</body>
</html>
