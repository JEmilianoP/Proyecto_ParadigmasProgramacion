<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxy Games - Administración</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white">
    <nav class="navbar navbar-expand-lg navbar-dark bg-secondary px-4">
        <a class="navbar-brand text-danger fw-bold" href="#">Galaxy Games - Panel Admin</a>
        <div class="ms-auto d-flex align-items-center">
            <span class="navbar-text text-white me-3">Modo Administrador</span>
            <button class="btn btn-danger btn-sm" id="logoutBtn">Cerrar Sesión</button>
        </div>
    </nav>

    <div class="container my-5">
        <div class="row g-4">
            <div class="col-md-4">
                <div class="card bg-secondary text-white shadow">
                    <div class="card-body">
                        <h4 class="card-title text-info mb-3">Alta de Producto</h4>
                        <form id="addProductForm">
                            <div class="mb-3">
                                <label class="form-label">Nombre del Juego</label>
                                <input type="text" id="prodName" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Descripción</label>
                                <textarea id="prodDesc" class="form-control" rows="2"></textarea>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Precio</label>
                                <input type="number" id="prodPrice" class="form-control" step="0.01" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Inventario Inicial</label>
                                <input type="number" id="prodStock" class="form-control" required>
                            </div>
                            <button type="submit" class="btn btn-info w-100 text-dark fw-bold">Guardar Producto</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-8">
                <h3 class="mb-3 text-warning">Inventario General</h3>
                <div class="table-responsive bg-secondary rounded p-3">
                    <table class="table table-dark table-striped align-middle mb-0">
                        <thead>
                            <tr>
                                <th>Nombre</th>
                                <th>Precio</th>
                                <th>Stock Actual</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="adminInventoryTable">
                            </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="javascripts/admin.js"></script>
</body>
</html>
